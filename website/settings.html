<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Settings | CHIPELEC Power System</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
    <script src="js/api.js"></script>
    <script>
        requireCustomerLogin();
        const customer = getCustomerData();
    </script>

    <nav class="navbar">
        <div class="container">
            <a href="index.html" class="navbar-brand">CHIPELEC<span>.</span></a>
            <button class="mobile-menu-btn" onclick="document.querySelector('.sidebar').classList.toggle('show')">
                <i class="fas fa-bars"></i>
            </button>
            <div class="nav-links d-none d-md-flex">
                <a href="#" class="d-flex align-items-center gap-2"><i class="fas fa-user-circle"></i> <span id="navCustomerName">Customer</span></a>
                <a href="#" onclick="customerLogout()" class="btn btn-outline">Logout</a>
            </div>
        </div>
    </nav>

    <div class="dashboard-layout">
        <aside class="sidebar">
            <ul class="sidebar-nav">
                <li><a href="customer-dashboard.html"><i class="fas fa-home"></i> Overview</a></li>
                <li><a href="products.html"><i class="fas fa-box-open"></i> Products</a></li>
                <li><a href="installation.html"><i class="fas fa-tools"></i> Installations</a></li>
                <li><a href="service-request.html"><i class="fas fa-wrench"></i> Service Requests</a></li>
                <li><a href="quotation.html"><i class="fas fa-file-invoice"></i> Quotations</a></li>
                <li><a href="enquiry.html"><i class="fas fa-question-circle"></i> Enquiries</a></li>
                <li><a href="settings.html" class="active"><i class="fas fa-cog"></i> Settings</a></li>
            </ul>
            <div class="sidebar-footer">
                <a href="#" onclick="customerLogout()" class="btn btn-secondary" style="width: 100%;">
                    <i class="fas fa-sign-out-alt"></i> Logout
                </a>
            </div>
        </aside>
        
        <main class="main-content">
            <div class="page-header">
                <h1>Account Settings</h1>
                <p>Manage your profile and security preferences.</p>
            </div>

            <!-- Profile Card -->
            <div class="card mb-6">
                <div class="card-header">
                    <h3>Update Profile</h3>
                </div>
                <div class="card-body">
                    <form id="profileForm">
                        <div class="d-flex gap-4" style="flex-wrap: wrap;">
                            <div class="form-group" style="flex: 1; min-width: 250px;">
                                <label class="form-label">Full Name *</label>
                                <input type="text" id="profName" class="form-control" required>
                            </div>
                            <div class="form-group" style="flex: 1; min-width: 250px;">
                                <label class="form-label">Email Address (Read-only)</label>
                                <input type="email" id="profEmail" class="form-control" readonly style="background-color: var(--bg-color);">
                            </div>
                            <div class="form-group" style="flex: 1; min-width: 250px;">
                                <label class="form-label">Phone Number *</label>
                                <input type="tel" id="profPhone" class="form-control" required>
                            </div>
                            <div class="form-group" style="flex: 1; min-width: 250px;">
                                <label class="form-label">City</label>
                                <input type="text" id="profCity" class="form-control">
                            </div>
                            <div class="form-group" style="flex: 1; min-width: 250px;">
                                <label class="form-label">State</label>
                                <input type="text" id="profState" class="form-control">
                            </div>
                            <div class="form-group" style="flex: 1; min-width: 250px;">
                                <label class="form-label">Pincode</label>
                                <input type="text" id="profPincode" class="form-control">
                            </div>
                        </div>
                        
                        <div class="form-group">
                            <label class="form-label">Full Address</label>
                            <textarea id="profAddress" class="form-control" rows="3"></textarea>
                        </div>

                        <div id="profAlert" style="display: none; padding: 15px; border-radius: 6px; margin-bottom: 20px; font-weight: 500;"></div>

                        <button type="submit" class="btn btn-primary">Save Changes</button>
                    </form>
                </div>
            </div>

            <!-- Password Card -->
            <div class="card">
                <div class="card-header">
                    <h3>Change Password</h3>
                </div>
                <div class="card-body">
                    <form id="passwordForm" style="max-width: 480px;">
                        <div class="form-group">
                            <label class="form-label">Current Password *</label>
                            <input type="password" id="currentPass" class="form-control" required>
                        </div>
                        <div class="form-group">
                            <label class="form-label">New Password *</label>
                            <input type="password" id="newPass" class="form-control" required minlength="6">
                        </div>
                        <div class="form-group">
                            <label class="form-label">Confirm New Password *</label>
                            <input type="password" id="confirmPass" class="form-control" required minlength="6">
                        </div>

                        <div id="passAlert" style="display: none; padding: 15px; border-radius: 6px; margin-bottom: 20px; font-weight: 500;"></div>

                        <button type="submit" class="btn btn-primary">Update Password</button>
                    </form>
                </div>
            </div>
        </main>
    </div>
    <script>
        document.addEventListener('DOMContentLoaded', async () => {
            if(customer) {
                document.getElementById('navCustomerName').textContent = customer.full_name;

                // Load fresh profile data
                try {
                    const res = await window.api.customerAuth.getProfile();
                    if(res.success) {
                        const prof = res.data;
                        document.getElementById('profName').value = prof.full_name || '';
                        document.getElementById('profEmail').value = prof.email || '';
                        document.getElementById('profPhone').value = prof.phone || '';
                        document.getElementById('profAddress').value = prof.address || '';
                        document.getElementById('profCity').value = prof.city || '';
                        document.getElementById('profState').value = prof.state || '';
                        document.getElementById('profPincode').value = prof.pincode || '';
                        
                        // Update localstorage so other pages see new data
                        localStorage.setItem('customerData', JSON.stringify(prof));
                    }
                } catch(err) {
                    console.error("Failed to load profile:", err);
                }
            }

            // Profile Submit
            document.getElementById('profileForm').addEventListener('submit', async (e) => {
                e.preventDefault();
                const btn = e.target.querySelector('button');
                const alertBox = document.getElementById('profAlert');
                
                btn.disabled = true;
                btn.innerHTML = 'Saving...';
                
                try {
                    const data = {
                        full_name: document.getElementById('profName').value,
                        phone: document.getElementById('profPhone').value,
                        address: document.getElementById('profAddress').value,
                        city: document.getElementById('profCity').value,
                        state: document.getElementById('profState').value,
                        pincode: document.getElementById('profPincode').value
                    };
                    await window.api.customerAuth.updateProfile(data);
                    
                    // Update local storage object
                    const updatedCustomer = { ...customer, ...data };
                    localStorage.setItem('customerData', JSON.stringify(updatedCustomer));
                    document.getElementById('navCustomerName').textContent = data.full_name;
                    
                    alertBox.style.display = 'block';
                    alertBox.style.backgroundColor = '#dcfce7';
                    alertBox.style.color = '#166534';
                    alertBox.innerHTML = '<i class="fas fa-check-circle"></i> Profile updated successfully.';
                } catch (error) {
                    alertBox.style.display = 'block';
                    alertBox.style.backgroundColor = '#fee2e2';
                    alertBox.style.color = '#991b1b';
                    alertBox.innerHTML = `<i class="fas fa-exclamation-circle"></i> ${error.message}`;
                } finally {
                    btn.disabled = false;
                    btn.innerHTML = 'Save Changes';
                }
            });

            // Password Submit
            document.getElementById('passwordForm').addEventListener('submit', async (e) => {
                e.preventDefault();
                const btn = e.target.querySelector('button');
                const alertBox = document.getElementById('passAlert');
                
                const current_password = document.getElementById('currentPass').value;
                const new_password = document.getElementById('newPass').value;
                const confirm_password = document.getElementById('confirmPass').value;
                
                if (new_password !== confirm_password) {
                    alertBox.style.display = 'block';
                    alertBox.style.backgroundColor = '#fee2e2';
                    alertBox.style.color = '#991b1b';
                    alertBox.innerHTML = `<i class="fas fa-exclamation-circle"></i> Passwords do not match.`;
                    return;
                }

                btn.disabled = true;
                btn.innerHTML = 'Updating...';
                
                try {
                    await window.api.customerAuth.changePassword({ current_password, new_password });
                    alertBox.style.display = 'block';
                    alertBox.style.backgroundColor = '#dcfce7';
                    alertBox.style.color = '#166534';
                    alertBox.innerHTML = '<i class="fas fa-check-circle"></i> Password changed successfully.';
                    e.target.reset();
                } catch (error) {
                    alertBox.style.display = 'block';
                    alertBox.style.backgroundColor = '#fee2e2';
                    alertBox.style.color = '#991b1b';
                    alertBox.innerHTML = `<i class="fas fa-exclamation-circle"></i> ${error.message}`;
                } finally {
                    btn.disabled = false;
                    btn.innerHTML = 'Update Password';
                }
            });
        });
    </script>
</body>
</html>
