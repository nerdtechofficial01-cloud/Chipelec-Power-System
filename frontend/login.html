<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login | CHIPELEC Power System</title>
    
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    
    <!-- Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    
    <!-- Custom CSS -->
    <link rel="stylesheet" href="css/login.css">
</head>
<body>

    <div class="login-box">
        <h2>
            <i class="bi bi-lightning-charge-fill"></i>
            CHIPELEC
            <span style="font-size: 16px; font-weight: 500; color: #64748b; margin-top: -5px;">Power System Admin</span>
        </h2>
        
        <div class="input-group">
            <input type="email" id="email" placeholder="Email Address" autocomplete="email">
            <i class="bi bi-envelope"></i>
        </div>
        
        <div class="input-group">
            <input type="password" id="password" placeholder="Password" autocomplete="current-password">
            <i class="bi bi-lock"></i>
        </div>
        
        <button id="loginBtn" onclick="login()">
            <span>Login</span>
            <i class="bi bi-box-arrow-in-right"></i>
        </button>
        
        <div id="msg"></div>
    </div>

    <script src="js/config.js"></script>
    <script src="js/login.js"></script>
</body>
</html>
